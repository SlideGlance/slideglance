<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" role="img" aria-label="Two SlideGlance workflows: open a .pptx, or write and save a .sgx, both render in the live SlideGlance PPTX Viewer, which exports an editable .pptx for PowerPoint, Keynote, or Google Slides.">
  <style>
    .t { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  </style>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="7" refX="6" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L7 3 L0 6 z" fill="#64748B"/>
    </marker>
  </defs>

  <!-- card -->
  <rect x="1" y="1" width="718" height="358" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- edges (drawn before nodes so node fills sit on top of line ends) -->
  <line x1="200" y1="96" x2="200" y2="160" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="520" y1="96" x2="520" y2="160" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="360" y1="226" x2="360" y2="272" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- source A: .pptx -->
  <rect x="90" y="40" width="220" height="56" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.25"/>
  <text class="t" x="200" y="66" text-anchor="middle" font-size="15" font-weight="600" fill="#0F172A">.pptx</text>
  <text class="t" x="200" y="84" text-anchor="middle" font-size="11.5" fill="#64748B">anywhere</text>

  <!-- source B: .sgx -->
  <rect x="410" y="40" width="220" height="56" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.25"/>
  <text class="t" x="520" y="66" text-anchor="middle" font-size="15" font-weight="600" fill="#0F172A">.sgx</text>
  <text class="t" x="520" y="84" text-anchor="middle" font-size="11.5" fill="#64748B">your repo</text>

  <!-- hub: SlideGlance PPTX Viewer -->
  <rect x="180" y="162" width="360" height="64" rx="8" fill="#1F2937"/>
  <text class="t" x="360" y="190" text-anchor="middle" font-size="15.5" font-weight="600" fill="#FFFFFF">SlideGlance PPTX Viewer</text>
  <text class="t" x="360" y="210" text-anchor="middle" font-size="12" fill="#94A3B8">live webview preview</text>

  <!-- output: editable .pptx -->
  <rect x="168" y="272" width="384" height="62" rx="8" fill="#4F46E5"/>
  <text class="t" x="360" y="300" text-anchor="middle" font-size="15" font-weight="600" fill="#FFFFFF">editable .pptx file</text>
  <text class="t" x="360" y="320" text-anchor="middle" font-size="11.5" fill="#C7D2FE">PowerPoint · Keynote · Google Slides</text>

  <!-- edge labels -->
  <rect x="166" y="118" width="68" height="20" rx="4" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text class="t" x="200" y="132" text-anchor="middle" font-size="11" fill="#475569">open with</text>

  <rect x="476" y="118" width="88" height="20" rx="4" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text class="t" x="520" y="132" text-anchor="middle" font-size="11" fill="#475569">write + save</text>

  <rect x="318" y="239" width="84" height="20" rx="4" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text class="t" x="360" y="253" text-anchor="middle" font-size="11" fill="#475569">Export PPTX</text>
</svg>
