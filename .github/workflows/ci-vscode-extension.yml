name: CI - vscode-extension

on:
  push:
    branches: [main]
    paths:
      - "apps/vscode-extension/**"
      - "packages/builder/src/**"
      - "package.json"
      - "packages/builder/package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "packages/builder/tsconfig.json"
      - ".node-version"
      - ".github/workflows/ci-vscode-extension.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/vscode-extension/**"
      - "packages/builder/src/**"
      - "package.json"
      - "packages/builder/package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "packages/builder/tsconfig.json"
      - ".node-version"
      - ".github/workflows/ci-vscode-extension.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install wasm-pack
        # @slideglance/builder (built below) imports @slideglance/measure/node;
        # the wasm dist must exist before tsc runs.
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: latest
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build wasm artefacts
        run: bash scripts/build-wasm.sh
      - name: Build viewer (emits d.ts the vscode-extension typecheck reads)
        run: pnpm --filter @slideglance/viewer run build
      - name: Build builder
        run: pnpm --filter @slideglance/builder run build
      - name: Format check
        run: pnpm --filter slide-builder run fmt:check
      - name: Lint
        run: pnpm --filter slide-builder run lint
      - name: Type check
        run: pnpm --filter slide-builder run typecheck
      - name: Build
        run: pnpm --filter slide-builder run build
