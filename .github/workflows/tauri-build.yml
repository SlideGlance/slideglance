name: CI - tauri-build

# Desktop-viewer cross-platform build is a release-readiness check, not
# a merge gate. Running the 3-OS Tauri build on every push / PR was the
# single biggest contributor to CI wall time despite Tauri-relevant code
# changing rarely. Triggers:
#   - push of a v* tag — gates an actual release
#   - weekly schedule — catches upstream toolchain regressions
#   - workflow_dispatch — on-demand before cutting a release
# Per-PR validation lives in ci.yml (Rust workspace) and the JS workflows;
# cross-OS Tauri regressions are caught post-merge / nightly.
on:
  push:
    tags: ["v*"]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  # `contents: write` is required for the tag-triggered branch that
  # attaches built installers to the GitHub Release created by
  # release.yml. Non-tag runs (schedule / workflow_dispatch) never reach
  # the upload step, so the elevated scope is dormant there.
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tauri:
    strategy:
      fail-fast: false
      matrix:
        # Build the host's native triple per OS. The macOS universal
        # binary path (`--target universal-apple-darwin`) requires
        # tauri-cli to split into two `cargo build` calls, which is
        # version-sensitive and currently fails on the runner; the
        # native triple is sufficient for a release-readiness check.
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # pnpm version is sourced from the root `packageManager` field
      # (currently pnpm@10.33.0) — `pnpm-workspace.yaml` uses the
      # `catalog:` protocol that needs ≥ 9.5, and the lockfile is
      # generated by 10.x locally so CI must match to avoid
      # ERR_PNPM_LOCKFILE_CONFIG_MISMATCH.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          # `slideglance-wasm` is part of the JS workspaces' `prebuild`
          # step, so this build needs the wasm32 target alongside
          # the host triple.
          targets: wasm32-unknown-unknown
      - name: Install wasm-pack
        # The `packages/core` prebuild shells out to `wasm-pack` (via
        # `scripts/build-wasm.sh`). Pre-install it so the JS workspace
        # build doesn't fail with "wasm-pack not found in PATH".
        # `version: latest` pulls a wasm-pack that ships a recent
        # `cargo_toml` / `cargo_metadata` — older releases (≤ 0.12)
        # fail to parse `license.workspace = true` style workspace
        # inheritance with "invalid type: map, expected a string".
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: latest
      - name: Install Linux deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev
      - name: pnpm install
        run: pnpm install --frozen-lockfile
      # Build wasm artefacts up front so the per-package `prebuild`
      # hooks (viewer / chrome-extension / web-playground) collapse to
      # cache-hit no-ops. Without this, `pnpm -r build` would fan out
      # the same wasm-pack work across multiple packages and serialize
      # them on `build-wasm.sh`'s defense-in-depth lock.
      - name: Build wasm artefacts
        run: bash scripts/build-wasm.sh
      - name: Build JS workspaces
        run: pnpm -r --filter './packages/*' --filter './apps/*' build
      - name: tauri build
        run: pnpm --filter @slideglance/desktop-viewer tauri build
      - name: Upload installers (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: slideglance-viewer-${{ matrix.os }}
          path: apps/desktop-viewer/src-tauri/target/release/bundle/**
          if-no-files-found: ignore

      - name: Attach installers to GitHub Release
        # Runs only when this workflow was kicked off by a `v*` tag push.
        # `softprops/action-gh-release@v2` is idempotent: it creates the
        # Release if release.yml hasn't yet (race-safe across the two
        # workflows triggered by the same tag) and otherwise appends
        # files to the existing one.
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          # File-level globs: ship only the user-facing installer
          # bundles, not the bare `release/` binaries or `.app` dirs.
          files: |
            apps/desktop-viewer/src-tauri/target/release/bundle/dmg/*.dmg
            apps/desktop-viewer/src-tauri/target/release/bundle/macos/*.app.tar.gz
            apps/desktop-viewer/src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
            apps/desktop-viewer/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop-viewer/src-tauri/target/release/bundle/msi/*.msi.sig
            apps/desktop-viewer/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop-viewer/src-tauri/target/release/bundle/nsis/*.exe.sig
            apps/desktop-viewer/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop-viewer/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/desktop-viewer/src-tauri/target/release/bundle/appimage/*.AppImage.sig
            apps/desktop-viewer/src-tauri/target/release/bundle/rpm/*.rpm
          fail_on_unmatched_files: false
