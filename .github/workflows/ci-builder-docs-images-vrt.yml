name: CI - builder-docs-images-vrt

on:
  push:
    branches: [main]
    paths:
      - "packages/builder/docs/**"
      - "packages/builder/src/**"
      - "packages/builder/vrt/nodes/**"
      - "packages/builder/vrt/lib/**"
      - "package.json"
      - "packages/builder/package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".node-version"
      - "packages/builder/docker/**"
      - ".github/workflows/ci-builder-docs-images-vrt.yml"
  pull_request:
    branches: [main]
    paths:
      - "packages/builder/docs/**"
      - "packages/builder/src/**"
      - "packages/builder/vrt/nodes/**"
      - "packages/builder/vrt/lib/**"
      - "package.json"
      - "packages/builder/package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".node-version"
      - "packages/builder/docker/**"
      - ".github/workflows/ci-builder-docs-images-vrt.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docs-images-vrt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Pre-build the toolchain image so the compose run step reuses it
      # rather than triggering its own (uncached) build. `scope=builder-toolchain`
      # is shared with ci-builder-vrt so both workflows hit the same GHA
      # cache for the LibreOffice / ImageMagick / fonts apt layer + pnpm
      # install layer.
      - name: Build toolchain image (cached)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/builder/docker/Dockerfile
          tags: slideglance-builder-vrt:latest
          load: true
          cache-from: type=gha,scope=builder-toolchain
          cache-to: type=gha,mode=max,scope=builder-toolchain
      - name: Run docs images VRT in Docker
        working-directory: packages/builder
        run: docker compose -f docker/docker-compose.yml run --rm docs-images-vrt
      - name: Upload diff on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: builder-docs-images-vrt-diff
          path: packages/builder/docs/images/output/diff/
          if-no-files-found: ignore
