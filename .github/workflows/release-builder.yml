name: Release - builder

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile
      # Workaround: Node 22.x bundled npm has a missing module (promise-retry)
      # that breaks `npm install -g` directly; install npm via npx until the
      # patched Node ships. See https://github.com/npm/cli/issues/9151
      # and https://github.com/nodejs/node/issues/62425.
      - name: Upgrade npm for Trusted Publishing
        run: npx -y npm@11 install -g npm@11
      - run: pnpm --filter @slideglance/builder run build
      - run: pnpm --filter @slideglance/builder run test:run

      - name: Create Release PR or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          publish: pnpm exec changeset publish
          version: pnpm exec changeset version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true

      # vscode-extension is privately versioned by changesets but published
      # to the VS Code Marketplace separately. Detect a version bump on
      # main, build, and run vsce publish.
      - name: Check vscode-extension version change
        id: vscode-ext-check
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: |
          if git diff HEAD~1 --quiet -- apps/vscode-extension/package.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            VERSION=$(node -p "require('./apps/vscode-extension/package.json').version")
            TAG="vscode-extension-v${VERSION}"
            {
              echo "changed=true"
              echo "version=${VERSION}"
              echo "tag=${TAG}"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Format check (vscode-extension)
        if: steps.vscode-ext-check.outputs.changed == 'true'
        run: pnpm --filter @slideglance/vscode-extension run fmt:check

      - name: Lint (vscode-extension)
        if: steps.vscode-ext-check.outputs.changed == 'true'
        run: pnpm --filter @slideglance/vscode-extension run lint

      - name: Type check (vscode-extension)
        if: steps.vscode-ext-check.outputs.changed == 'true'
        run: pnpm --filter @slideglance/vscode-extension run typecheck

      - name: Build (vscode-extension)
        if: steps.vscode-ext-check.outputs.changed == 'true'
        run: pnpm --filter @slideglance/vscode-extension run build

      - name: Publish to VS Code Marketplace
        if: steps.vscode-ext-check.outputs.changed == 'true'
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          VERSION: ${{ steps.vscode-ext-check.outputs.version }}
        run: |
          npm install -g @vscode/vsce
          PKG_NAME=$(node -p "require('./apps/vscode-extension/package.json').name")
          PUBLISHER=$(node -p "require('./apps/vscode-extension/package.json').publisher")
          EXTENSION_ID="${PUBLISHER}.${PKG_NAME#@*/}"
          ALREADY_PUBLISHED=false
          if SHOW_OUTPUT=$(vsce show "${EXTENSION_ID}" --json 2>/dev/null); then
            PUBLISHED_VERSION=$(echo "${SHOW_OUTPUT}" | node -p "try{JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')).versions[0].version}catch(e){''}")
            if [ "${PUBLISHED_VERSION}" = "${VERSION}" ]; then
              ALREADY_PUBLISHED=true
            fi
          fi
          if [ "${ALREADY_PUBLISHED}" = "false" ]; then
            cd apps/vscode-extension
            vsce publish
          else
            echo "Version ${VERSION} already published, skipping"
          fi

      - name: Create Git tag (vscode-extension)
        if: steps.vscode-ext-check.outputs.changed == 'true'
        env:
          TAG: ${{ steps.vscode-ext-check.outputs.tag }}
        run: |
          if git ls-remote --tags origin "${TAG}" | grep -q "${TAG}"; then
            echo "Tag ${TAG} already exists, skipping"
          else
            git tag "${TAG}"
            git push origin "${TAG}"
          fi

      - name: Create GitHub Release (vscode-extension)
        if: steps.vscode-ext-check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.vscode-ext-check.outputs.tag }}
          VERSION: ${{ steps.vscode-ext-check.outputs.version }}
        run: |
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists, skipping"
          else
            PREV_TAG=$(git tag -l 'vscode-extension-v*' --sort=-v:refname | grep -v "^${TAG}$" | head -1)
            if [ -n "${PREV_TAG}" ]; then
              gh release create "${TAG}" \
                --title "vscode-extension v${VERSION}" \
                --generate-notes \
                --notes-start-tag "${PREV_TAG}"
            else
              gh release create "${TAG}" \
                --title "vscode-extension v${VERSION}" \
                --generate-notes
            fi
          fi

      - name: Sync pnpm-lock.yaml on Release PR branch
        if: steps.changesets.outputs.pullRequestNumber
        run: |
          git fetch origin changeset-release/main
          git checkout changeset-release/main
          pnpm install --lockfile-only
          pnpm exec prettier --write pnpm-lock.yaml
          if ! git diff --quiet -- pnpm-lock.yaml; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add pnpm-lock.yaml
            git commit -m "chore: sync pnpm-lock.yaml"
            git push origin changeset-release/main
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
