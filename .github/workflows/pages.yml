name: Deploy playground to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install binaryen
        run: |
          sudo apt-get update
          sudo apt-get install -y binaryen
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: Build wasm-pack targets
        run: |
          wasm-pack build crates/slideglance-wasm --target bundler --out-dir ../../packages/core/dist/bundler --out-name slideglance_wasm
          wasm-pack build crates/slideglance-wasm --target web     --out-dir ../../packages/core/dist/web     --out-name slideglance_wasm
          wasm-pack build crates/slideglance-wasm --target nodejs  --out-dir ../../packages/core/dist/node    --out-name slideglance_wasm
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @slideglance/viewer build
      # No sample-fixture staging step: the web-playground production
      # build ships drag-and-drop only (mirrors the chrome-extension
      # empty state). Bundling samples would require tracking large
      # `.pptx` binaries in the repo for a use case the empty state
      # already covers.
      - run: pnpm --filter @slideglance/web-playground build
      - run: pnpm --filter @slideglance/landing build
      - name: Assemble GitHub Pages site
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp -R apps/landing/dist/. _site/
          mkdir -p _site/playground
          cp -R apps/web-playground/dist/. _site/playground/
      # `enablement: true` re-enables the Pages site if a repo admin
      # (or an org-wide policy) silently disabled it. Without this the
      # `actions/deploy-pages` step fails with a bare 404 ("Ensure
      # GitHub Pages has been enabled") even though `pages: write` is
      # granted, because the deploy API requires the Pages site to
      # exist before it accepts an artifact.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
