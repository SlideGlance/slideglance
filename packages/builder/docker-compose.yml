services:
  vrt:
    build:
      context: ../..
      dockerfile: packages/builder/vrt/Dockerfile
    image: slideglance-builder-vrt:latest
    volumes:
      # Mount the output directory back to the host.
      - ./vrt/output:/app/packages/builder/vrt/output
    command: pnpm run vrt

  vrt-update:
    build:
      context: ../..
      dockerfile: packages/builder/vrt/Dockerfile
    image: slideglance-builder-vrt:latest
    volumes:
      # Mount the entire vrt/ directory so expected.png updates land on the host.
      - ./vrt:/app/packages/builder/vrt
    command: pnpm run vrt:update

  preview:
    build:
      context: ../..
      dockerfile: packages/builder/vrt/Dockerfile
    image: slideglance-builder-vrt:latest
    volumes:
      # Mount the preview output directory back to the host.
      - ./preview/output:/app/packages/builder/preview/output
    command: pnpm run preview

  docs-images:
    build:
      context: ../..
      dockerfile: packages/builder/vrt/Dockerfile
    image: slideglance-builder-vrt:latest
    volumes:
      # Mount the docs/images directory back to the host.
      - ./docs/images:/app/packages/builder/docs/images
    command: pnpm run docs:images

  docs-images-vrt:
    build:
      context: ../..
      dockerfile: packages/builder/vrt/Dockerfile
    image: slideglance-builder-vrt:latest
    volumes:
      # Reference docs/images/*.png as baselines.
      - ./docs/images:/app/packages/builder/docs/images:ro
      # Write VRT output back to the host.
      - ./docs/images/output:/app/packages/builder/docs/images/output
    command: pnpm run docs:images:vrt
